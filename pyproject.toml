[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "city-inspection-agent"
version = "0.1.0"
description = "Local open-source model agent for city infrastructure inspection reports"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["city_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
